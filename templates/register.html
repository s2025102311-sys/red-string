{% extends "base.html" %}
{% block title %}Register - Blood Donor Registry{% endblock %}
{% block content %}
<h2 class="page-title">Create an Account</h2>
<form method="POST">
    <div style="margin-bottom: 12px;">
        <label>Username:</label><br>
        <input type="text" name="username" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Email:</label><br>
        <input type="email" name="email" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Password:</label><br>
        <input type="password" name="password" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" required style="width: 100%; padding: 8px;">
    </div>
    <button type="submit" class="rs-btn">Register</button>
</form>
{% endblock %}
