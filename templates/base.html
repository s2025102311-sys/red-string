<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Red String{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="brand">Red String Blood Donor Registry</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="#">Communities</a>
      <a href="#">Learn</a>
      <a href="#">Login</a>
      <a href="#">Register</a>
    </div>
  </nav>

  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <div class="flash">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
