{% extends "base.html" %}
{% block title %}Edit Profile - Blood Donor Registry{% endblock %}
{% block content %}
<h2 class="page-title">Edit Your Profile</h2>
<form method="POST" enctype="multipart/form-data">
    <div class="profile-header" style="margin-bottom: 20px;">
        <img id="avatar-preview" src="{{ avatar_url(profile) }}" alt="Current profile picture" class="avatar avatar-lg">
        <div>
            <label for="picture"><strong>Profile picture</strong></label><br>
            <input type="file" id="picture" name="picture" accept=".png,.jpg,.jpeg,image/png,image/jpeg"
                   onchange="if (this.files[0]) document.getElementById('avatar-preview').src = URL.createObjectURL(this.files[0]);">
            <p class="muted" style="font-size: 0.85rem; margin: 4px 0;">PNG or JPG, up to 2 MB.</p>
            {% if profile.picture_filename and profile.picture_filename != 'default.jpg' %}
            <label style="font-size: 0.9rem;"><input type="checkbox" name="remove_picture"> Remove my picture</label>
            {% endif %}
        </div>
    </div>
    <div style="margin-bottom: 12px;">
        <label>Full Name:</label><br>
        <input type="text" name="full_name" value="{{ profile.full_name or '' }}" style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Location / Area:</label><br>
        <input type="text" name="location" value="{{ profile.location or '' }}" style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Blood Type:</label><br>
        <select name="blood_type" style="width: 100%; padding: 8px;">
            <option value="">Select...</option>
            <option value="A+" {% if profile.blood_type == 'A+' %}selected{% endif %}>A+</option>
            <option value="A-" {% if profile.blood_type == 'A-' %}selected{% endif %}>A-</option>
            <option value="B+" {% if profile.blood_type == 'B+' %}selected{% endif %}>B+</option>
            <option value="B-" {% if profile.blood_type == 'B-' %}selected{% endif %}>B-</option>
            <option value="AB+" {% if profile.blood_type == 'AB+' %}selected{% endif %}>AB+</option>
            <option value="AB-" {% if profile.blood_type == 'AB-' %}selected{% endif %}>AB-</option>
            <option value="O+" {% if profile.blood_type == 'O+' %}selected{% endif %}>O+</option>
            <option value="O-" {% if profile.blood_type == 'O-' %}selected{% endif %}>O-</option>
        </select>
    </div>
    <div style="margin-bottom: 12px;">
        <label>Sex:</label><br>
        <input type="text" name="sex" value="{{ profile.sex or '' }}" style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Birthdate:</label><br>
        <input type="date" name="birthdate" value="{{ profile.birthdate or '' }}" style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Bio:</label><br>
        <textarea name="bio" rows="4" style="width: 100%; padding: 8px;">{{ profile.bio or '' }}</textarea>
    </div>
    <div style="margin-bottom: 12px;">
        <label>
            <input type="checkbox" name="is_public" {% if profile.is_public %}checked{% endif %}> Make profile public
        </label>
    </div>
    <button type="submit" class="rs-btn">Save Changes</button>
</form>
{% endblock %}
