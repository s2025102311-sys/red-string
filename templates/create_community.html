{% extends "base.html" %}
{% block title %}Create Community - Red String{% endblock %}
{% block content %}
<div class="rs-card form-card">
    <h2>Create a Community</h2>
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Name</label>
            <input type="text" name="name" required maxlength="100" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px; font-weight: bold;">Description</label>
            <textarea name="description" rows="4" maxlength="1000" style="width: 100%; padding: 8px; box-sizing: border-box;"></textarea>
        </div>
        <button type="submit" class="rs-btn">Create</button>
        <a href="{{ url_for('communities') }}" class="rs-btn rs-btn-ghost" style="margin-left: 10px;">Cancel</a>
    </form>
</div>
{% endblock %}
