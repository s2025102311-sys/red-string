{% extends "base.html" %}
{% block title %}Login - Blood Donor Registry{% endblock %}
{% block content %}
<h2>Log In</h2>
<form method="POST">
    <div style="margin-bottom: 12px;">
        <label>Email:</label><br>
        <input type="email" name="email" required style="width: 100%; padding: 8px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label>Password:</label><br>
        <input type="password" name="password" required style="width: 100%; padding: 8px;">
    </div>
    <button type="submit" style="padding: 10px 20px; background: #9b0000; color: white; border: none; cursor: pointer;">Log In</button>
</form>
{% endblock %}
